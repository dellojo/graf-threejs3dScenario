<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgl - FBX loader - Chicken Dance</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<meta property="og:title" content="three.js webgl - FBX loader">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://threejs.org/examples/webgl_loader_fbx.html">
		<meta property="og:image" content="https://threejs.org/examples/screenshots/webgl_loader_fbx.jpg">
		<link type="text/css" rel="stylesheet" href="main.css">
	</head>

	<body>
		<div id="info">
			<a href="https://threejs.org" target="_blank" rel="noopener">three.js</a> - FBXLoader<br />
			Character and animation from <a href="https://www.mixamo.com/" target="_blank" rel="noopener">Mixamo</a>
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.module.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three';

			import Stats from 'three/addons/libs/stats.module.js';

			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
			import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

			// BLOQUE HDR: librería para cargar el escenario 360°
			import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';

			const manager = new THREE.LoadingManager();

			let camera, scene, renderer, controls, stats, object, loader, guiMorphsFolder, guiAnimationsFolder;
			let mixer;

			// CORRECCIÓN: se usa Clock en lugar de Timer
			const clock = new THREE.Clock();

			const modelName = 'Chicken Dance';
			const modelColor = 0xffc300;

			const params = {
				asset: modelName
			};

			const assets = [
				modelName,
			];

			const scales = new Map();
			scales.set( 'warrior/Warrior', 100 );
			scales.set( 'archer/ArcherRi01', 100 );
			scales.set( 'stanford-bunny', 0.001 );
			scales.set( 'Head_69', 100 );
			scales.set( 'ball_anims_asc_2018', 50 );

			init();

			function init() {

				const container = document.createElement( 'div' );
				document.body.appendChild( container );

				camera = new THREE.PerspectiveCamera( 45, window.innerWidth / window.innerHeight, 1, 2000 );
				camera.position.set( 100, 200, 300 );

				scene = new THREE.Scene();

				const hemiLight = new THREE.HemisphereLight( 0xffffff, 0x444444, 5 );
				hemiLight.position.set( 0, 200, 0 );
				scene.add( hemiLight );

				const dirLight = new THREE.DirectionalLight( 0xffffff, 5 );
				dirLight.position.set( 0, 200, 100 );
				dirLight.castShadow = true;
				dirLight.shadow.camera.top = 180;
				dirLight.shadow.camera.bottom = - 100;
				dirLight.shadow.camera.left = - 120;
				dirLight.shadow.camera.right = 120;
				scene.add( dirLight );

				// luz superior
				const topLight = new THREE.DirectionalLight( 0xffffff, 3 );
				topLight.position.set( 0, 500, 50 );
				topLight.castShadow = true;
				scene.add( topLight );

				// BLOQUE TEXTURA DEL PISO: imagen repetida sobre el plano
				const floorTexture = new THREE.TextureLoader().load( 'textures/piso.jpg' );
				floorTexture.wrapS = THREE.RepeatWrapping;
				floorTexture.wrapT = THREE.RepeatWrapping;
				floorTexture.repeat.set( 20, 20 );
				floorTexture.colorSpace = THREE.SRGBColorSpace;

				// ground
				const mesh = new THREE.Mesh( new THREE.PlaneGeometry( 2000, 2000 ), new THREE.MeshPhongMaterial( { map: floorTexture, depthWrite: false } ) );
				mesh.rotation.x = - Math.PI / 2;
				mesh.receiveShadow = true;
				scene.add( mesh );

				loader = new FBXLoader( manager );
				loadAsset( params.asset );

				renderer = new THREE.WebGLRenderer( { antialias: true } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( animate );
				renderer.shadowMap.enabled = true;
				container.appendChild( renderer.domElement );

				controls = new OrbitControls( camera, renderer.domElement );
				controls.enableZoom = false;
				controls.enablePan = false;
				controls.enableDamping = true;
				controls.target.set( 0, 100, 0 );
				controls.update();

				window.addEventListener( 'resize', onWindowResize );

				// stats
				stats = new Stats();
				container.appendChild( stats.dom );

				const gui = new GUI();
				gui.add( params, 'asset', assets ).onChange( function ( value ) {

					loadAsset( value );

				} );

				guiMorphsFolder = gui.addFolder( 'Morphs' ).hide();
				guiAnimationsFolder = gui.addFolder( 'Animations' ).hide();

				// --------------------------------------------------------------
				// BLOQUE HDR: escenario 3D en 360°
				const rgbeLoader = new RGBELoader();
				rgbeLoader.load( 'models/rgbe/fondo.hdr', function ( texture ) {

					texture.mapping = THREE.EquirectangularReflectionMapping;
					scene.background = texture;   // fondo que se ve
					scene.environment = texture;  // luz y reflejos

				} );

				// BLOQUE MÚSICA: mp3 de fondo (se activa con un clic en la página)
				const listener = new THREE.AudioListener();
				camera.add( listener );

				const sound = new THREE.Audio( listener );
				const audioLoader = new THREE.AudioLoader();
				audioLoader.load( 'models/rgbe/musica.mp3', function ( buffer ) {

					console.log( 'Audio cargado exitosamente' );
					sound.setBuffer( buffer );
					sound.setLoop( true );
					sound.setVolume( 0.5 );

				} );

				window.addEventListener( 'click', function () {

					if ( listener.context.state === 'suspended' ) listener.context.resume();
					if ( sound.buffer && ! sound.isPlaying ) sound.play();

				} );
				// --------------------------------------------------------------

			}

			function loadAsset( asset ) {

				loader.trimAnimationClips = ( asset === 'ball_anims_asc_2018' );

				loader.load( 'models/fbx/' + asset + '.fbx', function ( group ) {

					if ( object ) {

						object.traverse( function ( child ) {

							if ( child.isSkinnedMesh ) {

								child.skeleton.dispose();

							}

							if ( child.material ) {

								const materials = Array.isArray( child.material ) ? child.material : [ child.material ];
								materials.forEach( material => {

									if ( material.map ) material.map.dispose();
									material.dispose();
			
								} );
			
							}
			
							if ( child.geometry ) child.geometry.dispose();

						} );

						scene.remove( object );

					}

					//

					object = group;

					const scale = scales.get( asset );
					object.scale.setScalar( scale || 1 );

					guiAnimationsFolder.children.forEach( ( child ) => child.destroy() );
					guiAnimationsFolder.hide();

					if ( object.animations && object.animations.length ) {

						mixer = new THREE.AnimationMixer( object );

						const action = mixer.clipAction( object.animations[ 0 ] );
						action.play();

						const clips = object.animations;
						const animationParams = { clip: clips[ 0 ].name };

						guiAnimationsFolder.show();
						guiAnimationsFolder.add( animationParams, 'clip', clips.map( ( clip ) => clip.name ) ).onChange( function ( name ) {

							mixer.stopAllAction();

							const clip = THREE.AnimationClip.findByName( clips, name );
							mixer.clipAction( clip ).play();

						} );

					} else {

						mixer = null;

					}

					guiMorphsFolder.children.forEach( ( child ) => child.destroy() );
					guiMorphsFolder.hide();

					object.traverse( function ( child ) {

						if ( child.isMesh ) {

							child.castShadow = true;
							child.receiveShadow = true;

							// material con color propio y brillo
							child.material = new THREE.MeshPhongMaterial( {
								color: modelColor,
								specular: 0xffffff,
								shininess: 120
							} );

							if ( child.morphTargetDictionary ) {

								guiMorphsFolder.show();
								const meshFolder = guiMorphsFolder.addFolder( child.name || child.uuid );
								Object.keys( child.morphTargetDictionary ).forEach( ( key ) => {
			
									meshFolder.add( child.morphTargetInfluences, child.morphTargetDictionary[ key ], 0, 1, 0.01 );
			
								} );
			
							}

						}

					} );

					scene.add( object );

				} );

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			//

			function animate() {

				// CORRECCIÓN: delta con Clock
				const delta = clock.getDelta();

				if ( mixer ) mixer.update( delta );

				controls.update();

				renderer.render( scene, camera );

				stats.update();

			}

		</script>

	</body>
</html>
